name: Deploy SMV ASTRO Verification Handler to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "test/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "site/**"
      - "test/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: verify-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check handler syntax
        run: node --check site/auth/action.mjs
      - name: Run handler tests
        run: node --test test/handler.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
